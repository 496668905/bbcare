<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f7fb" />
    <title>口语模拟教练</title>
    <link rel="stylesheet" href="./coach.css" />
  </head>
  <body>
    <div class="coach-app">
      <header class="coach-top">
        <div>
          <h1>口语模拟教练</h1>
          <p>选场景 · 听 AI · 你说英文 · 即时反馈（无需服务器）</p>
        </div>
        <button type="button" class="btn ghost" id="navBack">← 返回</button>
      </header>

      <div id="noRecBanner" class="warn-banner" hidden>
        当前浏览器不支持语音识别（请使用 Chrome / Edge 桌面端或 Android，并允许麦克风权限）。
      </div>

      <section id="screenPick" class="screen on">
        <p class="progress">请选择一个对话场景：</p>
        <div class="scene-grid" id="sceneGrid"></div>
      </section>

      <section id="screenChat" class="screen">
        <p class="progress" id="progressText"></p>
        <div id="chatArea"></div>
        <div id="userPanel" hidden>
          <div class="prompt-user" id="userPrompt"></div>
          <button type="button" class="btn secondary" id="toggleHint" style="width: 100%; margin-bottom: 10px">
            显示 / 隐藏参考英文句
          </button>
          <div id="hintBox" class="bubble assistant" style="display: none">
            <div class="en" id="hintEn"></div>
          </div>
          <button type="button" class="btn rec" id="recBtn">点击开始说话（英文）</button>
          <p style="margin: 8px 0 0; font-size: 13px; color: var(--c-soft); text-align: center">
            再点一次结束识别；识别结果仅供参考，以发音清晰度为准。
          </p>
          <div id="feedbackArea"></div>
          <div class="row2" id="userActions" hidden>
            <button type="button" class="btn secondary" id="retryTurn">再说一次</button>
            <button type="button" class="btn" id="nextTurn">下一回合</button>
          </div>
        </div>
        <div class="row2" id="assistantActions" hidden>
          <button type="button" class="btn" id="assistantContinue">听完了，继续</button>
        </div>
      </section>
    </div>
    <script src="./coach.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => {
          navigator.serviceWorker.register("./sw.js").catch(() => {});
        });
      }
    </script>
  </body>
</html>
