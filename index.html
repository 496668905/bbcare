<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff4ec" />
    <title>Baby English</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="top-bar">
        <button id="backBtn" class="big-btn back-btn hidden" aria-label="返回主页">← 主页</button>
        <h1 id="pageTitle" tabindex="0" title="点击查看家长模式">Baby English</h1>
      </header>

      <main id="mainContent">
        <section id="homeView" class="view"></section>
        <section id="categoryView" class="view hidden">
          <div id="wordGrid" class="word-grid"></div>
          <button id="autoPlayBtn" class="big-btn auto-play-btn">自动轮播</button>
          <button id="replayBtn" class="big-btn replay-btn hidden">再次播放</button>
        </section>
      </main>

      <nav id="bottomTabs" class="bottom-tabs"></nav>
    </div>

    <div id="parentModal" class="modal hidden" role="dialog" aria-modal="true" aria-label="家长模式">
      <div class="modal-card">
        <h2>家长模式</h2>
        <label class="setting-item">
          <span>慢速发音（推荐）</span>
          <input id="slowModeToggle" type="checkbox" />
        </label>
        <label class="setting-item">
          <span>自动轮播词数：<b id="wordCountValue">4</b></span>
          <input id="wordCountInput" type="range" min="3" max="6" step="1" value="4" />
        </label>
        <label class="setting-item">
          <span>轮播间隔：<b id="delayValue">2.2</b> 秒</span>
          <input id="delayInput" type="range" min="1.5" max="4" step="0.1" value="2.2" />
        </label>
        <label class="setting-item">
          <span>家长学习模式（英->中讲解）</span>
          <input id="parentLearningToggle" type="checkbox" />
        </label>
        <label class="setting-item">
          <span>英文发音偏好</span>
          <select id="englishVoiceSelect">
            <option value="us">美音（推荐）</option>
            <option value="uk">英音</option>
            <option value="auto">自动选择</option>
          </select>
        </label>
        <label class="setting-item">
          <span>儿童英文读音来源</span>
          <select id="childAudioEngineSelect">
            <option value="system">系统实时朗读</option>
            <option value="local">本地课程读音（推荐）</option>
          </select>
        </label>
        <label class="setting-item">
          <span>高质量云端发音</span>
          <select id="ttsEngineSelect">
            <option value="system">关闭（使用本机）</option>
            <option value="azure">开启（Azure Neural）</option>
          </select>
        </label>
        <label class="setting-item">
          <span>Azure 区域（如 eastasia）</span>
          <input id="azureRegionInput" type="text" placeholder="eastasia" />
        </label>
        <label class="setting-item">
          <span>Azure Key（仅保存在本机浏览器）</span>
          <input id="azureApiKeyInput" type="password" placeholder="请输入 Azure Speech Key" />
        </label>
        <p class="setting-note">开启云端后，英文将使用更清晰的神经网络语音；请求失败会自动回退到本机发音。</p>
        <button id="closeParentModalBtn" class="big-btn close-modal-btn">完成</button>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
