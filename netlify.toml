[build]
  publish = "."

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=600"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=600"
